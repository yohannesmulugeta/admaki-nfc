name: Deploy NFC staging
on:
  workflow_dispatch:
  push:
    branches: [feature/maison-four-independent-cards]
    paths:
      - 'worker/**'
      - 'public/**'
      - 'profiles/**'
      - 'scripts/**'
      - 'wrangler.staging.toml'
      - 'package*.json'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Deploy isolated staging Worker
        run: npx wrangler deploy --config wrangler.staging.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 2a0b619cf019c336f7208f21a1fa28cd
