<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADMAKI Card Manager</title><style>body{font:15px system-ui;background:#f5f7f6;color:#173a2a;margin:0}header{background:#173a2a;color:white;padding:22px}main{max-width:900px;margin:auto;padding:20px}.cards{display:flex;gap:12px;flex-wrap:wrap}.card,section{background:white;padding:20px;border-radius:12px;border:1px solid #ddd;margin:12px 0}label{display:block;margin-top:12px}input,textarea{display:block;width:100%;box-sizing:border-box;padding:9px;border:1px solid #aaa;border-radius:6px}button{background:#173a2a;color:white;padding:11px;border:0;border-radius:7px;margin:8px 5px 8px 0;cursor:pointer}</style><header><b>ADMAKI DIGITAL</b> · Client Dashboard</header><main><h1>Your NFC cards</h1><section id="login"><h2>Sign in</h2><form id="loginForm"><label>Username<input name="username" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button>Log in</button></form></section><section id="account" hidden><h2>Account settings</h2><form id="passwordForm"><label>Current password<input name="currentPassword" type="password" autocomplete="current-password" required></label><label>New password<input name="newPassword" type="password" minlength="12" autocomplete="new-password" required></label><button>Change password</button></form><button id="logout">Log out</button></section><p id="status" role="status">Loading…</p><div class="cards" id="cards"></div><section id="editor" hidden><h2 id="title"></h2><a id="link" target="_blank" rel="noopener">View public card</a><form id="form"><div id="fields"></div><button>Save draft</button><button type="button" id="publish">Publish</button></form></section></main><script type="module" src="/dashboard/dashboard.js"></script></html>
