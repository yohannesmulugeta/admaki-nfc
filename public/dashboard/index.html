<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADMAKI Card Manager</title><link rel="stylesheet" href="/dashboard/dashboard.css"><header><b>ADMAKI DIGITAL</b> · Client Dashboard</header><main><h1>Your digital cards</h1><section id="login"><h2>Sign in</h2><form id="loginForm"><label>Username<input name="username" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button>Log in</button></form></section><section id="account" hidden><h2>Account settings</h2><form id="passwordForm"><label>Current password<input name="currentPassword" type="password" autocomplete="current-password" required></label><label>New password<input name="newPassword" type="password" minlength="12" autocomplete="new-password" required></label><button>Change password</button></form><button id="logout">Log out</button></section><p id="status" role="status">Loading…</p><div class="cards" id="cards"></div><section id="editor" hidden><h2 id="title"></h2><a id="link" target="_blank" rel="noopener">View public card</a><form id="form"><div id="fields"></div><button>Save draft</button><button type="button" id="publish">Publish saved draft</button><button type="button" id="discard">Discard draft</button><button type="button" id="preview">Preview edits</button></form><div id="previewContent" class="preview" hidden></div><h3>Published history</h3><div id="history"></div></section></main><script type="module" src="/dashboard/dashboard.js"></script></html>
