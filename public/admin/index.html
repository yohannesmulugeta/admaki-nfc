<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADMAKI — Super Admin</title><link rel="stylesheet" href="/admin/admin.css"><header><strong>ADMAKI DIGITAL</strong> / Super Admin</header><main><h1>Digital Card Management</h1><p id="message" role="status">Checking access…</p><section id="signin" hidden><h2>Admin sign in</h2><form id="login"><label>Username <input name="username" autocomplete="username" required></label><label>Password <input name="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form></section><div id="workspace" hidden><div class="grid"><div class="stat"><small>Companies</small><h2 id="companyCount">—</h2></div><div class="stat"><small>Digital cards</small><h2 id="cardCount">—</h2></div></div><section><h2>Create company</h2><form id="createCompany"><label>Company name <input name="name" placeholder="e.g. Universal Electronics" minlength="2" maxlength="120" required></label><button>Create company</button></form><small>Create a company, then open it to manage its client accounts and assigned cards.</small></section><section><h2>Clients</h2><div id="companies"></div><div id="clientTools" hidden><h3 id="clientTitle"></h3><div id="clientCards"></div><h3>Client accounts</h3><div id="clientUsers"></div><form id="createUser"><label>Username <input name="username" minlength="3" maxlength="64" required autocomplete="off"></label><label>Display name <input name="displayName" maxlength="120" required></label><label>Temporary password <input name="password" type="password" minlength="12" maxlength="128" required autocomplete="new-password"></label><button>Create client account</button></form></div></section><section><h2>Account</h2><form id="passwordForm"><label>Current password <input name="currentPassword" type="password" required></label><label>New password <input name="newPassword" type="password" minlength="12" required></label><button>Change my password</button></form><button id="logout" type="button">Log out</button></section></div></main><script type="module" src="/admin/admin.js"></script></html>
