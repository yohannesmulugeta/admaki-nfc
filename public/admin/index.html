<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADMAKI — Super Admin</title><style>:root{font:15px system-ui;color:#173a2a;background:#f5f7f6}body{margin:0}header{background:#173a2a;color:white;padding:22px}main{max-width:1100px;margin:auto;padding:24px}section,.company{background:white;border:1px solid #e2e7e4;border-radius:14px;padding:20px;margin:15px 0}button{background:#173a2a;color:white;border:0;border-radius:8px;padding:12px 18px;cursor:pointer}input{padding:12px;border:1px solid #aaa;border-radius:7px;max-width:100%;box-sizing:border-box}label{display:block;margin:12px 0}small{color:#66736b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.stat{background:#e8eee9;padding:15px;border-radius:10px}a{color:#173a2a}#message{min-height:1.5em}</style><header><strong>ADMAKI DIGITAL</strong> / Super Admin</header><main><h1>Digital Card Management</h1><p id="message" role="status">Checking access…</p><section id="signin" hidden><h2>Admin sign in</h2><form id="login"><label>Username <input name="username" autocomplete="username" required></label><label>Password <input name="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form></section><div id="workspace" hidden><div class="grid"><div class="stat"><small>Companies</small><h2 id="companyCount">—</h2></div><div class="stat"><small>Digital cards</small><h2 id="cardCount">—</h2></div></div><section><h2>Create company</h2><form id="createCompany"><label>Company name <input name="name" placeholder="e.g. Universal Electronics" minlength="2" maxlength="120" required></label><button>Create company</button></form><small>Creating a company does not yet create a client login or public card.</small></section><section><h2>Clients</h2><div id="companies"></div></section><section><h2>Account</h2><form id="passwordForm"><label>Current password <input name="currentPassword" type="password" required></label><label>New password <input name="newPassword" type="password" minlength="12" required></label><button>Change my password</button></form><button id="logout" type="button">Log out</button></section></div></main><script type="module" src="/admin/admin.js"></script></html>
